# Default configuration. Paths are relative to the repository root unless given on the command line.
seed: 42

data:
  seasons: [dry, first_flush, dilution]
  season_labels: {dry: Dry, first_flush: First Flush, dilution: Dilution}
  files: {dry: dry.csv, first_flush: first_flush.csv, dilution: dilution.csv}
  station_column: Station
  target: O_IWQI
  ec_raw_column: CE

features:
  all: [NO3, pH, EC, TDS, HCO3, Cl, Mg, Ca, Na, K, SO4, SAR, "Na%", MAR, PI, RSBC, SSP]
  measured: [NO3, pH, EC, TDS, HCO3, Cl, Mg, Ca, Na, K, SO4]

models:
  base_learners: [Lasso, ExtraTrees, SVR]   # fixed a priori for Stacking and Voting
  optuna_trials: 80
  explained: auto   # or a mapping {season: model}

grids:
  XGBoost:
    n_estimators: [100, 200, 300]
    max_depth: [3, 5, 7]
    learning_rate: [0.01, 0.05, 0.1]
    reg_alpha: [0, 0.1, 1.0]
    reg_lambda: [0.1, 1.0, 10.0]
    subsample: [0.8, 1.0]
    colsample_bytree: [0.8, 1.0]
  RandomForest:
    n_estimators: [100, 200, 300]
    max_depth: [null, 5, 10, 15]
    min_samples_split: [2, 5, 10]
    min_samples_leaf: [1, 2, 4]
  ExtraTrees:
    n_estimators: [100, 200, 300]
    max_depth: [null, 5, 10, 15]
    min_samples_split: [2, 5, 10]
  GradientBoosting:
    n_estimators: [100, 200, 300]
    max_depth: [3, 5, 7]
    learning_rate: [0.01, 0.05, 0.1]
    subsample: [0.8, 1.0]
  LightGBM:
    n_estimators: [100, 200, 300]
    max_depth: [3, 5, 7, -1]
    learning_rate: [0.01, 0.05, 0.1]
    num_leaves: [15, 31, 63]
    reg_alpha: [0, 0.1, 1.0]
    reg_lambda: [0.1, 1.0, 10.0]
  CatBoost:
    iterations: [100, 200, 300]
    depth: [4, 6, 8]
    learning_rate: [0.01, 0.05, 0.1]
    l2_leaf_reg: [1, 3, 9]
  Ridge:
    alpha: [0.01, 0.1, 1.0, 10.0, 100.0]
  Lasso:
    alpha: [0.001, 0.01, 0.1, 1.0, 10.0]
  ElasticNet:
    alpha: [0.001, 0.01, 0.1, 1.0, 10.0]
    l1_ratio: [0.1, 0.3, 0.5, 0.7, 0.9]
  SVR:
    C: [0.1, 1, 10, 100]
    epsilon: [0.01, 0.1, 0.5]
    kernel: [rbf, poly]
  KNN:
    n_neighbors: [3, 5, 7, 9]
    weights: [uniform, distance]
    p: [1, 2]
lightgbm_small_sample_grid:
  min_child_samples: [2, 3, 5]
  min_data_in_bin: [1, 3]
  min_split_gain: [0]
  num_leaves: [4, 8, 15]
  learning_rate: [0.05, 0.1]
  n_estimators: [100, 300]

validation:
  test_size: 0.2            # fixed split used by the original protocol
  original_cv_folds: 4      # unshuffled K-fold on the training part of the split
  inner_cv_folds: 4         # nested CV, inner K-fold on the outer-training wells
  inner_shuffle: true
  scale_in_fold: false      # true: scaler fitted inside every fold for scale-sensitive models

groups:
  Salinity: [EC, TDS, Cl, SO4]
  Sodium/sodicity: [Na, SAR, "Na%", SSP, PI]
  Alkalinity/carbonate: [HCO3, RSBC, pH]
  Nutrients: [NO3]
  Other cations/hardness: [Ca, Mg, MAR, K]

shap:
  corr_nsamples: 20000      # Monte Carlo samples of the correlation-dependent linear explainer
  kernel_nsamples: 10000    # KernelSHAP samples
  permutation_repeats: 200
  single_class_models: [ExtraTrees, Ridge]
  pairs: {}                 # optional {season: [[A, B], ...]} for pairwise rank probabilities

bootstrap:
  performance_B: 5000
  shap_B: 500
